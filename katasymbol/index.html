<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katasymbol label printer</title>
<script>
  const themeStorageKey = "katasymbol-theme";
  try {
    if (localStorage.getItem(themeStorageKey) === "light") {
      document.documentElement.dataset.theme = "light";
    }
  } catch (error) {
    console.warn("Could not load the theme preference.", error);
  }
</script>
<link rel="stylesheet" href="rounded-fonts.css">
<style>
  :root {
    color-scheme: dark;
    font: 100%/1.5 system-ui, sans-serif;
    color: var(--text);
    background: var(--page);
    --text: #e4ede8;
    --page: #101815;
    --surface: #1b2823;
    --muted: #b2c3ba;
    --line: #36483f;
    --accent: #8dd8bb;
    --on-accent: #10251c;
    --input-border: #6b8277;
    --button-border: #6b8277;
    --focus: #8dd8bb;
    --status: #24362e;
    --error-background: #402721;
    --error-text: #ffb9a8;
    --preview-background: #141e1a;
    --preview-track: #25362e;
    --preview-ruler: #afc4b8;
    --preview-mark: #409c80;
    --shadow: #0005;
    --backdrop: #0009;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --text: #182421;
    --page: #edf2ef;
    --surface: #fff;
    --muted: #53625a;
    --line: #d5dfd9;
    --accent: #175744;
    --on-accent: #fff;
    --input-border: #a9b7af;
    --button-border: #9fb8ae;
    --focus: #3f997c;
    --status: #eff5f1;
    --error-background: #fff0eb;
    --error-text: #8d3425;
    --preview-background: #e8eeea;
    --preview-track: #f4f7f5;
    --preview-ruler: #536d61;
    --preview-mark: #175744;
    --shadow: #243d3010;
    --backdrop: #18242180;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { width: min(100% - 2rem, 48rem); margin: 1rem auto clamp(2rem, 8vw, 5rem); }
  .panel {
    padding: clamp(1.15rem, 5vw, 1.75rem);
    background: var(--surface); border: 1px solid var(--line); border-radius: 1rem;
    box-shadow: 0 14px 32px var(--shadow);
  }
  label, #connection-identity { font-weight: 650; }
  label { display: block; margin-bottom: .4rem; }
  .row { display: flex; gap: .65rem; }
  select, input, textarea, button {
    min-height: 2.85rem; border-radius: .55rem; font: inherit;
  }
  select, input, textarea { min-width: 0; width: 100%; border: 1px solid var(--input-border); color: inherit; background-color: var(--surface); padding: .55rem .75rem; }
  textarea { display: block; resize: vertical; }
  select {
    flex: 1; appearance: none; padding-right: 2rem;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
    background-size: 5px 5px; background-repeat: no-repeat;
  }
  button { padding: .55rem .9rem; cursor: pointer; font-weight: 650; }
  .secondary { color: var(--accent); background: var(--surface); border: 1px solid var(--button-border); }
  .secondary[aria-pressed="true"] { color: var(--on-accent); background: var(--accent); }
  .primary { color: var(--on-accent); background: var(--accent); border: 1px solid var(--accent); width: 100%; margin-top: 1rem; }
  .connection-row { display: flex; align-items: center; gap: .5rem; }
  #connect { flex: none; width: auto; padding-inline: .7rem; font-size: .875rem; }
  #connect[data-connected] { color: #fff; background: #a92d31; border-color: #a92d31; }
  #connection-identity { display: flex; flex: 1; min-width: 0; gap: .5rem; }
  #connection-device { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #connection-battery { flex: none; white-space: nowrap; }
  .connection-row .checkbox-option { flex: none; margin: 0; white-space: nowrap; }
  button:enabled:hover { filter: brightness(.93); }
  button:disabled { cursor: default; opacity: .55; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .hint, .status, figcaption { color: var(--muted); font-size: .875rem; }
  .hint { margin: .65rem 0 0; }
  .checkbox-option { display: flex; align-items: center; gap: .45rem; margin: .55rem 0 0; font-size: .875rem; font-weight: 400; }
  .checkbox-option[hidden] { display: none; }
  .checkbox-option input { width: auto; min-height: 0; margin: 0; accent-color: var(--accent); }
  .status { margin: .75rem 0 0; padding: .6rem .75rem; background: var(--status); border-radius: .45rem; overflow-wrap: anywhere; }
  .status[data-kind="error"] { background: var(--error-background); color: var(--error-text); }
  #label-form { border-top: 1px solid var(--line); padding-top: 1.2rem; margin-top: 1.2rem; }
  .editor-toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: .65rem; margin-top: .75rem; }
  .element-tools { display: flex; flex: 1 0 100%; align-items: start; gap: clamp(.25rem, 1vw, .4rem); }
  .item-tools, .add-item-tools { display: flex; min-width: 0; gap: inherit; }
  .item-tools { flex: 1; flex-wrap: wrap; }
  .element-tools .secondary:not([hidden]), .text-alignment .secondary { display: grid; place-items: center; width: 2.85rem; padding: 0; }
  .element-tools .secondary:not([hidden]) { min-width: 0; width: clamp(2rem, 9vw, 2.85rem); }
  #theme-toggle { flex: none; }
  .element-tools .checkbox-option { margin: 0 0 0 .35rem; min-height: 2.85rem; }
  .element-tools svg, .text-alignment svg { width: 1.35rem; height: 1.35rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  :root[data-theme="light"] .theme-sun, :root:not([data-theme="light"]) .theme-moon { display: none; }
  .item-picker { flex: 1 1 6rem; min-width: 0; }
  .item-actions { display: flex; gap: clamp(.35rem, 1.5vw, .65rem); }
  .item-actions .secondary { width: auto; padding-inline: clamp(.45rem, 2vw, .9rem); }
  .label-files { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem; margin-top: 1rem; }
  .label-files label { margin: 0; }
  .label-files input[type="text"] { flex: 1 1 8rem; width: auto; }
  .label-files .secondary { width: auto; }
  figure { margin: 1rem 0 0; }
  .preview-margins {
    display: grid; grid-template-columns: auto minmax(0, 5rem) minmax(0, 1fr) minmax(0, 5rem);
    align-items: center; gap: clamp(.35rem, 1.5vw, .75rem); margin-top: .5rem;
  }
  .preview-margins span { font-size: .875rem; font-weight: 650; }
  .preview-margins input { padding-inline: .25rem; text-align: center; }
  #right-margin { grid-column: 4; }
  .preview { max-height: min(50vh, 24rem); overflow: auto; overflow-anchor: none; background: var(--preview-background); border-radius: .6rem; }
  #preview-scroll {
    width: 100%; min-height: 2.75rem; margin: 0; padding: 0; border: 0;
    background: transparent; accent-color: var(--accent); cursor: ew-resize; touch-action: pan-y;
  }
  #preview-scroll:not([hidden]) { display: block; }
  canvas { display: block; cursor: grab; touch-action: none; }
  canvas:focus-visible { outline-offset: -3px; }
  canvas:active { cursor: grabbing; }
  #preview[data-tool="line"] { cursor: crosshair; }
  figcaption { margin-top: .4rem; }
  .inspector { margin-top: 1rem; }
  .inspector[data-no-selection] > :not(.fields),
  .inspector[data-no-selection] .fields > :not(#line-settings) { display: none; }
  #text-alignments:not([hidden]) { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: .65rem; }
  .text-alignment { display: flex; gap: .25rem; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(7.75rem, 1fr)); align-items: end; gap: .65rem; margin: .65rem 0; }
  .fields > div { min-width: 0; }
  dialog { width: min(100% - 2rem, 28rem); padding: 1.25rem; border: 1px solid var(--line); border-radius: .85rem; color: inherit; background: var(--surface); }
  dialog::backdrop { background: var(--backdrop); }
  dialog h2 { margin: 0 0 .75rem; }
  dialog a { color: var(--accent); }
  dialog .row { margin-top: .75rem; }
  .file-import { border-top: 1px solid var(--line); margin-top: 1rem; padding-top: 1rem; }
  #graphic-adjustments { margin-top: 1rem; }
  #graphic-threshold { display: block; accent-color: var(--accent); padding: 0; }
  .graphic-preview { display: flex; overflow: auto; max-height: min(32vh, 16rem); padding: .5rem; }
  .graphic-preview canvas {
    flex: none; margin: auto; background: #fff; image-rendering: pixelated; cursor: default; touch-action: auto;
  }
  @media (max-width: 520px) {
    .connection-row { flex-wrap: wrap; }
    #connection-identity { flex-basis: 100%; }
  }
  @media (max-width: 400px) {
    .editor-toolbar { column-gap: .45rem; }
    .item-picker { flex-basis: 5.5rem; }
    .item-actions .secondary { font-size: .875rem; }
  }
  @media (max-width: 350px) { .row { flex-wrap: wrap; } .secondary { width: 100%; } }
</style>
</head>
<body>
<main>
  <section class="panel" aria-label="Printer and label">
    <div class="connection-row">
      <span id="connection-identity" role="status">
        <span id="connection-device">Connected: none</span>
        <span id="connection-battery" hidden></span>
      </span>
      <button id="connect" class="secondary" type="button">Connect</button>
      <label class="checkbox-option" title="Include nearby devices that do not match known E10 or E16 Bluetooth names">
        <input id="scan-all" type="checkbox" aria-label="Show all BLE devices"> Show all
      </label>
    </div>
    <p id="connection-error" class="status" data-kind="error" role="alert" hidden></p>
    <form id="label-form" novalidate>
      <div class="editor-toolbar">
        <div class="element-tools" role="group" aria-label="Label tools">
          <div class="item-tools">
            <div class="add-item-tools">
              <button id="add-text" class="secondary" type="button" aria-label="Add text" title="Add text">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7V4h14v3M12 4v16m-4 0h8"/></svg>
              </button>
              <button id="add-icon" class="secondary" type="button" aria-label="Add icon" title="Add icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/></svg>
              </button>
              <button id="add-graphic" class="secondary" type="button" aria-label="Add graphic" title="Add graphic">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m3 17 5-4 4 3 5-6 4 5"/></svg>
              </button>
              <button id="draw-line" class="secondary" type="button" aria-label="Draw line" title="Draw line" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 20 4"/></svg>
              </button>
              <button id="add-rectangle" class="secondary" type="button" aria-label="Add rectangle" title="Add rectangle">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14"/></svg>
              </button>
              <button id="add-ellipse" class="secondary" type="button" aria-label="Add circle or ellipse" title="Add circle or ellipse">
                <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg>
              </button>
            </div>
            <label class="checkbox-option" title="Invert black and white for the entire label">
              <input id="label-invert" type="checkbox"> Invert
            </label>
          </div>
          <button id="theme-toggle" class="secondary" type="button" aria-label="Switch to light mode" title="Switch to light mode" hidden>
            <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
            <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.3A9 9 0 1 1 10.7 3.1a7 7 0 0 0 10.2 10.2Z"/></svg>
          </button>
        </div>
        <div class="item-picker">
          <label for="label-items">Selected item</label>
          <select id="label-items"></select>
        </div>
        <div class="item-actions">
          <button id="copy-item" class="secondary" type="button" disabled>Copy</button>
          <button id="paste-item" class="secondary" type="button" disabled>Paste</button>
          <button id="remove-item" class="secondary" type="button" disabled>Remove</button>
        </div>
      </div>
      <figure>
        <div id="preview-viewport" class="preview"><canvas id="preview" width="320" height="176" tabindex="0" role="img" aria-label="Label editor"></canvas></div>
        <input id="preview-scroll" type="range" min="0" max="0" value="0" step="1" aria-label="Scroll label preview horizontally" aria-controls="preview-viewport" hidden>
        <div class="preview-margins" role="group" aria-labelledby="margins-heading">
          <span id="margins-heading">Margins</span>
          <input id="left-margin" type="number" min="0" max="1024" step="1" value="10" inputmode="numeric" aria-label="Left margin (px)">
          <input id="right-margin" type="number" min="0" max="1024" step="1" value="10" inputmode="numeric" aria-label="Right margin (px)">
        </div>
        <figcaption id="dimensions" aria-live="polite"></figcaption>
      </figure>
      <div id="item-inspector" class="inspector" hidden>
        <div id="text-content">
          <label for="label-text">Text</label>
          <textarea id="label-text" rows="2" maxlength="120" spellcheck="false"></textarea>
        </div>
        <label class="checkbox-option text-style">
          <input id="text-fixed-size" type="checkbox"> Fixed size
        </label>
        <div id="text-alignments" hidden>
          <div id="text-align-x" class="text-alignment" role="group" aria-label="Horizontal text alignment">
            <button class="secondary" type="button" value="left" aria-label="Align left" title="Align left" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 10h10M4 15h16M4 20h10"/></svg>
            </button>
            <button class="secondary" type="button" value="center" aria-label="Align center" title="Align center" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M7 10h10M4 15h16M7 20h10"/></svg>
            </button>
            <button class="secondary" type="button" value="right" aria-label="Align right" title="Align right" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M10 10h10M4 15h16M10 20h10"/></svg>
            </button>
          </div>
          <div id="text-align-y" class="text-alignment" role="group" aria-label="Vertical text alignment">
            <button class="secondary" type="button" value="top" aria-label="Align top" title="Align top" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16M6 9h12M8 13h8M6 17h12"/></svg>
            </button>
            <button class="secondary" type="button" value="middle" aria-label="Align middle" title="Align middle" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12M4 12h16M6 17h12"/></svg>
            </button>
            <button class="secondary" type="button" value="bottom" aria-label="Align bottom" title="Align bottom" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M6 15h12M8 11h8M6 7h12"/></svg>
            </button>
          </div>
        </div>
        <label id="item-invert-option" class="checkbox-option" hidden>
          <input id="item-invert" type="checkbox"> Invert black and white
        </label>
        <div class="fields">
          <div id="line-settings" hidden>
            <label for="line-width">Line thickness (mm)</label>
            <input id="line-width" type="number" min="0.125" max="12" step="0.125" value="0.5" inputmode="decimal">
          </div>
          <div class="text-style">
            <label for="text-font">Font</label>
            <select id="text-font">
              <option value="standard">Standard</option>
              <option value="narrow">Narrow</option>
              <option value="trebuchet">Trebuchet MS</option>
              <option value="verdana">Verdana</option>
              <option value="monospace">Monospace</option>
              <option value="georgia">Georgia (Serif)</option>
              <option value="dosis" disabled>Dosis (Rounded Narrow)</option>
              <option value="saira-extra-condensed" disabled>Saira Extra Condensed</option>
            </select>
          </div>
          <div class="text-style">
            <label for="text-weight">Weight</label>
            <select id="text-weight"><option value="400">Normal</option><option value="700">Bold</option></select>
          </div>
          <div id="item-size-control">
            <label id="item-size-label" for="item-size">Height (mm)</label>
            <input id="item-size" type="number" min="0.5" max="64" step="0.125" inputmode="decimal">
          </div>
          <div class="box-size" hidden>
            <label for="item-width">Width (mm)</label>
            <input id="item-width" type="number" step="0.125" inputmode="decimal">
          </div>
          <div class="box-size" hidden>
            <label for="item-height">Height (mm)</label>
            <input id="item-height" type="number" step="0.125" inputmode="decimal">
          </div>
          <div>
            <label for="item-rotation">Rotation</label>
            <select id="item-rotation">
              <option value="0">0°</option>
              <option value="90">90°</option>
              <option value="180">180°</option>
              <option value="270">270°</option>
            </select>
          </div>
          <div>
            <label for="item-x">X (mm)</label>
            <input id="item-x" type="number" step="0.125" inputmode="decimal">
          </div>
          <div>
            <label for="item-y">Y (mm)</label>
            <input id="item-y" type="number" step="0.125" inputmode="decimal">
          </div>
        </div>
      </div>
      <button id="print" class="primary" type="submit" disabled>Print label</button>
      <p id="print-status" class="status" role="status" hidden></p>
      <div class="label-files">
        <label for="design-name">Project name</label>
        <input id="design-name" type="text">
        <button id="export-label" class="secondary" type="button">Export</button>
        <button id="import-label" class="secondary" type="button">Import</button>
        <input id="label-file" type="file" accept=".json,application/json" hidden>
      </div>
      <p id="label-file-status" class="status" role="status" hidden></p>
    </form>
  </section>
  <dialog id="icon-dialog" aria-labelledby="icon-heading">
    <h2 id="icon-heading">Add a Material Design icon</h2>
    <form id="icon-form">
      <label for="icon-name">Icon name or Pictogrammers link</label>
      <input id="icon-name" type="text" placeholder="alert-outline" required maxlength="240" autocomplete="off" spellcheck="false">
      <p class="hint"><a href="https://pictogrammers.com/library/mdi/" target="_blank" rel="noopener noreferrer">Browse Material Design Icons</a></p>
      <div class="row">
        <button id="import-icon" class="secondary" type="submit">Import icon</button>
        <button id="close-icons" class="secondary" type="button">Cancel</button>
      </div>
    </form>
    <div class="file-import">
      <label for="icon-file">Or upload a downloaded SVG</label>
      <input id="icon-file" type="file" accept=".svg,image/svg+xml">
    </div>
    <p id="icon-status" class="status" role="status" hidden></p>
  </dialog>
  <dialog id="graphic-dialog" aria-labelledby="graphic-heading">
    <h2 id="graphic-heading">Add a graphic</h2>
    <form id="graphic-form">
      <label for="graphic-url">Direct link to an SVG, PNG, or JPG</label>
      <input id="graphic-url" type="url" required spellcheck="false" autocomplete="off" placeholder="https://example.com/logo.png">
      <div class="row">
        <button id="load-graphic" class="secondary" type="submit">Load link</button>
      </div>
    </form>
    <div class="file-import">
      <label for="graphic-file">Or upload an SVG, PNG, or JPG</label>
      <input id="graphic-file" type="file" accept=".svg,.png,.jpg,.jpeg,image/svg+xml,image/png,image/jpeg">
    </div>
    <p id="graphic-status" class="status" role="status" hidden></p>
    <div id="graphic-adjustments" hidden>
      <div class="fields">
        <div>
          <label for="graphic-threshold">Threshold <span id="graphic-threshold-value">128</span></label>
          <input id="graphic-threshold" type="range" min="0" max="255" value="128">
        </div>
        <div>
          <label for="graphic-height">Height (mm)</label>
          <input id="graphic-height" type="number" step="0.125" inputmode="decimal">
        </div>
      </div>
      <label class="checkbox-option">
        <input id="graphic-invert" type="checkbox"> Invert black and white
      </label>
      <figure>
        <div id="graphic-preview" class="preview graphic-preview" tabindex="0" role="region" aria-label="Black and white preview"></div>
        <figcaption id="graphic-dimensions"></figcaption>
      </figure>
    </div>
    <div class="row">
      <button id="insert-graphic" class="secondary" type="button" disabled>Add to label</button>
      <button id="close-graphics" class="secondary" type="button">Cancel</button>
    </div>
  </dialog>
</main>
<noscript>This printer page needs JavaScript.</noscript>

  if (canvas.height !== surfaceHeight) canvas.height = surfaceHeight;
  canvas.style.width = scale < 1 ? `${width}px` : "";
  canvas.style.height = scale < 1 ? `${height}px` : "";
  if (viewport.scrollLeft !== scrollLeft) viewport.scrollLeft = scrollLeft;
  if (viewport.scrollTop !== scrollTop) viewport.scrollTop = scrollTop;
  const scrollRange = viewport.scrollWidth - viewport.clientWidth;
  previewScroll.max = scrollRange;
  previewScroll.hidden = scrollRange === 0;
  syncPreviewScroll();

  if (scale < 1) {
    ctx.save();
    ctx.scale(surfaceWidth / width, surfaceHeight / height);
  }
  ctx.clearRect(0, 0, width, height);
  const trackWidth = Math.min(MAX_ARTWORK_WIDTH, width - previewX);
  ctx.fillStyle = trackColor;
  ctx.fillRect(previewX, previewY, trackWidth, PRINTABLE_HEIGHT);
  if (printBounds) {
    const bounds = printBounds;
    const pageX = previewX + bounds.worldX;
    ctx.shadowColor = "#263b3030";
    ctx.shadowBlur = 6;
    ctx.fillStyle = "#fff";
    ctx.fillRect(pageX, previewY - TAPE_MARGIN, bounds.width, TAPE_HEIGHT);
    ctx.shadowBlur = 0;
    ctx.drawImage(artwork, bounds.sourceX, 0, bounds.width, PRINTABLE_HEIGHT,
      pageX, previewY, bounds.width, PRINTABLE_HEIGHT);
  }

  if (draft) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(previewX, previewY, trackWidth, PRINTABLE_HEIGHT);
    ctx.clip();
    ctx.fillStyle = markColor;
    drawItems(ctx, [draft], previewX, previewY);
    ctx.restore();
  }

  const overflow = previewItems.filter(({ x, y, layout }) => x < 0 || y < 0
    || x + layout.width > MAX_ARTWORK_WIDTH || y + layout.height > PRINTABLE_HEIGHT);
  if (overflow.length) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, width, height);
    ctx.rect(previewX, previewY, trackWidth, PRINTABLE_HEIGHT);
    ctx.clip("evenodd");
    ctx.fillStyle = markColor;
    ctx.globalAlpha = .32;
    drawItems(ctx, overflow, previewX, previewY);
    ctx.restore();
  }

  drawRulers(previewX + (printBounds?.worldX ?? 0), previewY, previewX + trackWidth, rulerColor);

  if (selected) {
    const { x, y, layout } = selected;
    ctx.strokeStyle = markColor;
    const handles = layout.endpoints ? [0, 1].map((index) => lineEndpointPosition(selected, index))
      : corners.map((corner) => cornerPosition(selected, corner));
    if (!layout.endpoints) {
      ctx.setLineDash([4, 2]);
      ctx.strokeRect(previewX + x - HANDLE_OFFSET + .5, previewY + y - HANDLE_OFFSET + .5,
        layout.width + 2 * HANDLE_OFFSET, layout.height + 2 * HANDLE_OFFSET);
      ctx.setLineDash([]);
    }
    ctx.fillStyle = "#fff";
    for (const point of handles) {
      const handleX = previewX + point.x - HANDLE_SIZE / 2;
      const handleY = previewY + point.y - HANDLE_SIZE / 2;
      ctx.fillRect(handleX, handleY, HANDLE_SIZE, HANDLE_SIZE);
      ctx.strokeRect(handleX + .5, handleY + .5, HANDLE_SIZE - 1, HANDLE_SIZE - 1);
    }
  }
  if (scale < 1) ctx.restore();
}

function updatePrintButton() {
  printButton.disabled = !connection || working || !printBounds;
}

function renderLabel() {
  printBounds = renderArtwork();
  drawPreview();
  const tapeSize = `${toMillimetres(TAPE_HEIGHT)} mm`;
  const printHeight = `${toMillimetres(PRINTABLE_HEIGHT)} mm printable height`;
  const caption = printBounds
    ? `${toMillimetres(printBounds.width)} × ${tapeSize} · ${printHeight} · Continuous tape`
    : `Blank label · ${tapeSize} continuous tape · ${printHeight}`;
  if (dimensions.textContent !== caption) dimensions.textContent = caption;
  updatePrintButton();
}

labelInvert.addEventListener("change", renderLabel);

for (const [side, input] of [["left", leftMarginInput], ["right", rightMarginInput]]) {
  const update = () => {
    if (!Number.isFinite(input.valueAsNumber)) return;
    const value = clamp(Math.round(input.valueAsNumber), 0, Number(input.max));
    if (value === margins[side]) return;
    margins[side] = value;
    renderLabel();
  };
  input.addEventListener("input", update);
  input.addEventListener("change", () => {
    update();
    input.value = margins[side];
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      input.blur();
    }
  });
}

const shapeItemNames = new Map([["line", "Line"], ["rectangle", "Rectangle"], ["ellipse", "Circle / ellipse"]]);
const initialShapeIndexes = () => new Map([...shapeItemNames.keys()].map((kind) => [kind, 1]));
let nextShapeIndexes = initialShapeIndexes();

function numberShape(item, indexes) {
  const index = indexes.get(item.kind);
  item.shapeIndex = index;
  indexes.set(item.kind, index + 1);
}

function itemName(item) {
  if (shapeItemNames.has(item.kind)) return `${shapeItemNames.get(item.kind)} ${item.shapeIndex}`;
  if (item.kind !== "text") return item.name;
  return item.text.trim().replace(/\s+/g, " ").slice(0, 42) || "Empty text";
}

function updateItemPicker() {
  itemPicker.replaceChildren(new Option(items.length ? "Select an item" : "No items", ""));
  for (const item of items) itemPicker.add(new Option(itemName(item), item.id));
  itemPicker.disabled = items.length === 0;
  itemPicker.value = selected?.id ?? "";
}

function updatePlacementInputs() {
  const fixedText = isFixedText(selected);
  const box = hasBoxSize(selected);
  sizeControl.hidden = isShape(selected) || selected.kind === "line";
  if (!sizeControl.hidden) {
    const { min, max } = itemSizeLimits(selected);
    sizeLabel.textContent = fixedText ? "Font size (mm)" : selected.rotation % 180 ? "Width (mm)" : "Height (mm)";
    sizeInput.min = toMillimetres(min);
    sizeInput.max = toMillimetres(max);
    sizeInput.value = toMillimetres(selected.size);
  }
  for (const control of boxSizeControls) control.hidden = !box;
  if (box) {
    const { min, maxWidth, maxHeight } = boxSizeLimits(selected);
    boxWidthInput.min = boxHeightInput.min = toMillimetres(min);
    boxWidthInput.max = toMillimetres(maxWidth);
    boxHeightInput.max = toMillimetres(maxHeight);
    boxWidthInput.value = toMillimetres(selected.layout.width);
    boxHeightInput.value = toMillimetres(selected.layout.height);
  }
  const { minX, maxX, minY, maxY } = placementLimits(selected);
  xInput.step = yInput.step = toMillimetres(selected.layout.endpoints ? 1 : .5);
  xInput.min = toMillimetres(minX);
  xInput.max = toMillimetres(maxX);
  xInput.value = toMillimetres(selected.x);
  yInput.min = toMillimetres(minY);
  yInput.max = toMillimetres(maxY);
  yInput.value = toMillimetres(selected.y);
}

function updateRotationOptions() {
  rotationInput.value = String(selected.rotation);
  for (const option of rotationInput.options) {
    option.disabled = selected.kind === "line" && Math.abs(verticalLineDelta(selected, Number(option.value))) > PRINTABLE_HEIGHT;
  }
}

function updateTextAlignment() {
  const fixed = isFixedText(selected);
  fixedSizeInput.checked = fixed;
  textAlignments.hidden = !fixed;
  for (const [property, buttons] of alignmentButtons) {
    for (const button of buttons) button.setAttribute("aria-pressed", String(fixed && selected[property] === button.value));
  }
}

function selectItem(item) {
  if (drag && item !== selected) endDrag();
  selected = item;
  itemPicker.value = item?.id ?? "";
  copyButton.disabled = removeButton.disabled = !item;
  updateLineSettings();
  updateTextAlignment();
  itemInvertOption.hidden = item?.kind !== "graphic";
  if (!itemInvertOption.hidden) itemInvert.checked = Boolean(item.inverted);
  if (item) {
    updateRotationOptions();
    const isText = item.kind === "text";
    for (const control of textControls) control.hidden = !isText;
    if (isText) {
      labelInput.value = item.text;
      fontInput.value = item.font;
      weightInput.value = item.weight;
    }
    updatePlacementInputs();
  }
  drawPreview();
}

function revealRange(start, length, scroll, viewSize) {
  const end = start + length;
  const padding = 12;
  if (length > viewSize - 2 * padding && end > scroll && start < scroll + viewSize) return scroll;
  if (start < scroll + padding || length > viewSize - 2 * padding) return start - padding;
  if (end > scroll + viewSize - padding) return end - viewSize + padding;
  return scroll;
}

function revealSelected() {
  viewport.scrollLeft = revealRange(previewX + selected.x, selected.layout.width, viewport.scrollLeft, viewport.clientWidth);
  viewport.scrollTop = revealRange(previewY + selected.y, selected.layout.height, viewport.scrollTop, viewport.clientHeight);
}

function addItem(properties) {
  if (nextShapeIndexes.get(properties.kind) === Number.MAX_SAFE_INTEGER) {
    showLabelFileStatus("This project has reached its shape numbering limit.", true);
    return;
  }
  let x = 0;
  for (const item of items) x = Math.max(x, item.x + item.layout.width + 12);
  const item = { x, y: (PRINTABLE_HEIGHT - (properties.size ?? properties.height ?? 0)) / 2,
    rotation: 0, ...properties, id: String(nextItemId++) };
  layoutItem(item);
  if (shapeItemNames.has(item.kind)) numberShape(item, nextShapeIndexes);
  items.push(item);
  updateItemPicker();
  selectItem(item);
  renderLabel();
  if (items.length > 1) revealSelected();
}

function copySelected() {
  if (!selected || drag) return;
  const { id, x, shapeIndex, ...properties } = selected;
  copiedItem = properties;
  pasteButton.disabled = false;
}

function pasteItem() {
  if (!copiedItem || drag) return;
  const properties = { ...copiedItem };
  if (selected) {
    const offset = 10;
    const { width, height } = copiedItem.layout;
    properties.x = selected.x + (selected.layout.width - width) / 2 + offset;
    properties.y = selected.y + (selected.layout.height - height) / 2 + offset;
  }
  addItem(properties);
  if (items.length === 1) revealSelected();
  canvas.focus({ preventScroll: true });
}

function removeSelected() {
  if (!selected) return;
  const index = items.indexOf(selected);
  items.splice(index, 1);
  updateItemPicker();
  selectItem(items[index] ?? items[index - 1] ?? null);
  renderLabel();
  if (selected) revealSelected();
}

function updateSelectedLayout() {
  layoutItem(selected);
  updatePlacementInputs();
  updateLineSettings();
  renderLabel();
}

function updateLineSettings() {
  const item = lineTool ? null : selected;
  const shape = isShape(item);
  let maxWidth = PRINTABLE_HEIGHT;
  if (shape) maxWidth = maxShapeLineWidth(item.width, item.height);
  if (item?.kind === "line") maxWidth = Math.min(maxWidth, MAX_ARTWORK_WIDTH - Math.max(Math.abs(item.dx), Math.abs(item.dy)));
  inspector.hidden = !selected && !lineTool;
  inspector.toggleAttribute("data-no-selection", !selected);
  lineSettings.hidden = !lineTool && item?.lineWidth === undefined;
  lineWidthLabel.textContent = lineTool ? "New line thickness (mm)" : shape ? "Border thickness (mm)" : "Line thickness (mm)";
  lineWidthInput.max = toMillimetres(maxWidth);
  lineWidthInput.value = toMillimetres(item?.lineWidth ?? lineWidth);
}

function setLineTool(active) {
  if (drag) endDrag();
  lineTool = active;
  drawLineButton.setAttribute("aria-pressed", String(active));
  canvas.dataset.tool = active ? "line" : "";
  canvas.style.cursor = "";
  updateLineSettings();
  if (active) canvas.focus({ preventScroll: true });
}

drawLineButton.addEventListener("click", () => setLineTool(!lineTool));
lineWidthInput.addEventListener("change", () => {
  if (Number.isFinite(lineWidthInput.valueAsNumber)) {
    const width = clamp(Math.round(lineWidthInput.valueAsNumber * DOTS_PER_MM), 1, Number(lineWidthInput.max) * DOTS_PER_MM);
    if (lineTool || selected?.kind === "line") lineWidth = width;
    if (!lineTool && selected?.lineWidth !== undefined) {
      if (selected.kind === "line") {
        const offset = (selected.lineWidth - width) / 2;
        selected.x += offset;
        selected.y += offset;
      }
      selected.lineWidth = width;
      updateSelectedLayout();
      return;
    }
  }
  updateLineSettings();
});
lineWidthInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    event.preventDefault();
    lineWidthInput.blur();
  }
});
document.querySelector("#add-text").addEventListener("click", () => {
  addItem({ kind: "text", text: "Text", font: "standard", weight: "400", size: 32 });
  labelInput.focus();
  labelInput.select();
});
for (const [kind, width] of [["rectangle", 48], ["ellipse", 32]]) {
  document.querySelector(`#add-${kind}`).addEventListener("click", () => {
    if (lineTool) setLineTool(false);
    addItem({ kind, width, height: 32, lineWidth: DEFAULT_LINE_WIDTH });
    canvas.focus({ preventScroll: true });
  });
}
copyButton.addEventListener("click", copySelected);
pasteButton.addEventListener("click", pasteItem);
document.addEventListener("keydown", (event) => {
  if (event.defaultPrevented || event.isComposing || event.repeat || drag || event.altKey || event.shiftKey
    || !(event.metaKey || event.ctrlKey)
    || event.target.closest?.("dialog, textarea, input:not([type=checkbox]), [contenteditable]")) return;
  const key = event.key.toLowerCase();
  if (key === "c" && selected && window.getSelection()?.isCollapsed !== false) {
    event.preventDefault();
    copySelected();
  } else if (key === "v" && copiedItem) {
    event.preventDefault();
    pasteItem();
  }
});
removeButton.addEventListener("click", () => {
  removeSelected();
  (items.length ? itemPicker : document.querySelector("#add-text")).focus();
});
itemPicker.addEventListener("change", () => {
  selectItem(items.find((item) => item.id === itemPicker.value) ?? null);
  if (selected) revealSelected();
});
labelInput.addEventListener("input", () => {
  selected.text = labelInput.value;
  updateItemPicker();
  updateSelectedLayout();
});
fontInput.addEventListener("change", () => {
  selected.font = fontInput.value;
  updateSelectedLayout();
});
weightInput.addEventListener("change", () => {
  selected.weight = weightInput.value;
  updateSelectedLayout();
});
fixedSizeInput.addEventListener("change", () => {
  if (selected?.kind !== "text" || fixedSizeInput.checked === isFixedText(selected)) return;
  if (drag) endDrag();
  const layout = selected.layout.unrotated ?? selected.layout;
  selected.fixedSize = fixedSizeInput.checked;
  if (selected.fixedSize) {
    selected.width = Math.max(1, layout.width);
    selected.height = Math.max(1, layout.height);
    selected.alignX ??= "left";
    selected.alignY ??= "top";
  }
  const size = (selected.fixedSize ? layout.fontSize : layout.textHeight) ?? selected.size;
  const { min, max } = itemSizeLimits(selected);
  selected.size = clamp(Math.round(size), min, max);
  updateTextAlignment();
  updateSelectedLayout();
  revealSelected();
});
for (const [property, buttons] of alignmentButtons) {
  for (const button of buttons) button.addEventListener("click", () => {
    if (!isFixedText(selected) || selected[property] === button.value) return;
    selected[property] = button.value;
    updateTextAlignment();
    updateSelectedLayout();
  });
}
itemInvert.addEventListener("change", () => {
  if (selected?.kind !== "graphic") return;
  selected.inverted = itemInvert.checked;
  updateSelectedLayout();
});
rotationInput.addEventListener("change", () => {
  if (!selected) return;
  const rotation = Number(rotationInput.value);
  if (selected.kind === "line" && Math.abs(verticalLineDelta(selected, rotation)) > PRINTABLE_HEIGHT) {
    updateRotationOptions();
    return;
  }
  if (drag) endDrag();
  const centerX = selected.x + selected.layout.width / 2;
  const centerY = selected.y + selected.layout.height / 2;
  selected.rotation = rotation;
  layoutItem(selected);
  placeItem(selected, centerX - selected.layout.width / 2, centerY - selected.layout.height / 2);
  updatePlacementInputs();
  renderLabel();
  revealSelected();
});
for (const [input, property] of [
  [sizeInput, "size"], [boxWidthInput, "width"], [boxHeightInput, "height"], [xInput, "x"], [yInput, "y"],
]) {
  input.addEventListener("change", () => {
    if (!selected || input.parentElement.hidden) return;
    if (Number.isFinite(input.valueAsNumber)) {
      const dots = input.valueAsNumber * DOTS_PER_MM;
      if (property === "width" || property === "height") {
        resizeBox(selected, property === "width" ? dots : selected.layout.width,
          property === "height" ? dots : selected.layout.height);
      } else if (property === "x" || property === "y") {
        moveSelection(property === "x" ? dots : selected.x, property === "y" ? dots : selected.y);
        updatePlacementInputs();
        revealSelected();
        return;
      } else {
        selected[property] = clamp(Math.round(dots), Number(input.min) * DOTS_PER_MM, Number(input.max) * DOTS_PER_MM);
      }
      updateSelectedLayout();
      revealSelected();
    } else {
      updatePlacementInputs();
    }
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      input.blur();
    }
  });
}

function previewPoint(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return { x: clientX - rect.left - previewX, y: clientY - rect.top - previewY };
}

function moveSelection(x, y) {
  const previousX = selected.x, previousY = selected.y;
  placeItem(selected, x, y);
  if (previousX === selected.x && previousY === selected.y) return;
  updatePlacementInputs();
  renderLabel();
}

function boundedLineDelta(startX, startY, endX, endY, width, shiftKey) {
  const extent = MAX_ARTWORK_WIDTH - width;
  const dx = clamp(Math.round(endX - startX), Math.max(-startX, -extent), Math.min(MAX_ARTWORK_WIDTH - startX, extent));
  const dy = clamp(Math.round(endY - startY), -startY, PRINTABLE_HEIGHT - startY);
  if (!shiftKey) return [dx, dy];
  return Math.abs(dx) >= Math.abs(dy) ? [dx, 0] : [0, dy];
}

function updateLineDraft(point) {
  const { startX, startY, lineWidth: width, shiftKey } = drag;
  const [dx, dy] = boundedLineDelta(startX, startY, point.x, point.y, width, shiftKey);
  drag.draft = null;
  if (dx || dy) {
    const draft = { kind: "line", dx, dy, lineWidth: width, rotation: 0,
      x: startX + Math.min(dx, 0) - width / 2, y: startY + Math.min(dy, 0) - width / 2 };
    layoutItem(draft);
    drag.draft = draft;
  }
  drawPreview();
}

function moveLineEndpoint(pointerDx, pointerDy) {
  const { index, moving, fixed } = drag.lineEndpoint;
  const { lineWidth, rotation } = selected;
  const radius = lineWidth / 2;
  const [dx, dy] = boundedLineDelta(fixed.x, fixed.y, moving.x + pointerDx, moving.y + pointerDy, lineWidth, drag.shiftKey);
  if (!dx && !dy) return;

  const x = fixed.x + Math.min(0, dx) - radius;
  const y = fixed.y + Math.min(0, dy) - radius;
  const [a, b, c, d] = quarterTurns[rotation];
  const direction = index === 0 ? -1 : 1;
  // Convert the edited on-screen segment back to the item’s unrotated coordinates.
  const line = { kind: "line", x, y, lineWidth, rotation,
    dx: direction * (a * dx + b * dy), dy: direction * (c * dx + d * dy) };
  if (selected.x === x && selected.y === y && selected.dx === line.dx && selected.dy === line.dy) return;
  layoutItem(line);
  Object.assign(selected, line);
  updatePlacementInputs();
  updateRotationOptions();
  updateLineSettings();
  renderLabel();
}

function updateDrag() {
  const point = previewPoint(drag.clientX, drag.clientY);
  if (drag.drawingLine) {
    updateLineDraft(point);
    return;
  }
  const dx = point.x - drag.startX, dy = point.y - drag.startY;
  if (drag.lineEndpoint) {
    moveLineEndpoint(dx, dy);
    return;
  }
  if (!drag.corner) {
    moveSelection(drag.x + dx, drag.y + dy);
    return;
  }

  const { corner, width, height, size, x, y } = drag;
  if (hasBoxSize(selected)) {
    if (!resizeBox(selected, width + dx * corner.x, height + dy * corner.y)) return;
  } else {
    // Project pointer movement onto the original resize diagonal to keep the aspect ratio.
    const change = (dx * corner.x * width + dy * corner.y * height) / (width * width + height * height);
    const { min, max } = itemSizeLimits(selected);
    const newSize = clamp(Math.round(size * (1 + change)), min, max);
    if (newSize === selected.size) return;
    selected.size = newSize;
  }
  layoutItem(selected);
  placeItem(selected, x + (corner.x < 0 ? width - selected.layout.width : 0),
    y + (corner.y < 0 ? height - selected.layout.height : 0));
  updatePlacementInputs();
  if (isShape(selected)) updateLineSettings();
  renderLabel();
}

function endDrag() {
  const pointerId = drag.id;
  drag = null;
  if (canvas.hasPointerCapture(pointerId)) canvas.releasePointerCapture(pointerId);
  cancelAnimationFrame(scrollFrame);
  scrollFrame = 0;
  canvas.style.cursor = "";
  drawPreview();
}

function edgeScroll(position, start, end) {
  if (position < start + 24) return Math.max(-32, Math.floor((position - start - 24) / 3));
  if (position > end - 24) return Math.min(32, Math.ceil((position - end + 24) / 3));
  return 0;
}

function scrollWhileDragging() {
  scrollFrame = 0;
  if (!drag) return;
  const rect = viewport.getBoundingClientRect();
  const { scrollLeft, scrollTop } = viewport;
  viewport.scrollLeft += edgeScroll(drag.clientX, rect.left, rect.right);
  viewport.scrollTop += edgeScroll(drag.clientY, rect.top, rect.bottom);
  if (viewport.scrollLeft === scrollLeft && viewport.scrollTop === scrollTop) return;
  updateDrag();
  scrollFrame = requestAnimationFrame(scrollWhileDragging);
}

canvas.addEventListener("pointerdown", (event) => {
  if (!event.isPrimary || event.button !== 0 || drag) return;
  const { x, y } = previewPoint(event.clientX, event.clientY);
  canvas.focus({ preventScroll: true });
  if (lineTool) {
    if (x < 0 || x > MAX_ARTWORK_WIDTH || y < 0 || y > PRINTABLE_HEIGHT) return;
    selectItem(null);
    drag = { id: event.pointerId, startX: Math.round(x), startY: Math.round(y),
      clientX: event.clientX, clientY: event.clientY, drawingLine: true, shiftKey: event.shiftKey, lineWidth };
    canvas.setPointerCapture(event.pointerId);
    return;
  }
  const touch = event.pointerType === "touch";
  const endpoint = lineEndpointAt(x, y, touch);
  const corner = resizeCornerAt(x, y, touch);
  const item = endpoint !== null || corner ? selected : items.findLast((entry) => {
    const px = x - entry.x, py = y - entry.y;
    const { width, height, hitTest } = entry.layout;
    return px >= -3 && px <= width + 3 && py >= -3 && py <= height + 3 && (!hitTest || hitTest(px, py));
  });
  selectItem(item ?? null);
  if (!item) return;
  drag = { id: event.pointerId, startX: x, startY: y, x: item.x, y: item.y,
    clientX: event.clientX, clientY: event.clientY, corner, size: item.size, shiftKey: event.shiftKey,
    width: item.layout.width, height: item.layout.height };
  if (endpoint !== null) {
    drag.lineEndpoint = { index: endpoint, moving: lineEndpointPosition(item, endpoint), fixed: lineEndpointPosition(item, 1 - endpoint) };
  }
  canvas.style.cursor = drag.lineEndpoint ? "crosshair" : corner?.cursor ?? "grabbing";
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener("pointermove", (event) => {
  if (!drag) {
    if (lineTool) return;
    const { x, y } = previewPoint(event.clientX, event.clientY);
    canvas.style.cursor = lineEndpointAt(x, y) !== null ? "crosshair" : resizeCornerAt(x, y)?.cursor ?? "";
    return;
  }
  if (drag.id !== event.pointerId) return;
  drag.clientX = event.clientX;
  drag.clientY = event.clientY;
  drag.shiftKey = event.shiftKey;
  updateDrag();
  if (!scrollFrame) scrollFrame = requestAnimationFrame(scrollWhileDragging);
});
canvas.addEventListener("pointerup", (event) => {
  if (drag?.id !== event.pointerId) return;
  if (drag.drawingLine || drag.lineEndpoint) {
    drag.clientX = event.clientX;
    drag.clientY = event.clientY;
    drag.shiftKey = event.shiftKey;
    updateDrag();
  }
  const { draft } = drag;
  endDrag();
  if (draft) {
    setLineTool(false);
    addItem(draft);
  }
});
for (const type of ["pointercancel", "lostpointercapture"]) {
  canvas.addEventListener(type, (event) => {

const SVG_NS = "http://www.w3.org/2000/svg";
let iconRequest = null;

function mdiName(value) {
  const input = value.trim().toLowerCase();
  const link = /^https:\/\/pictogrammers\.com\/library\/mdi\/icon\/([a-z0-9-]+)\/?(?:[?#].*)?$/.exec(input);
  const name = link ? link[1] : input.replace(/^mdi[:-]/, "");
  if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(name)) {
    throw new Error("Enter an icon name or a link to an icon from Pictogrammers.");
  }
  return name;
}

function readIcon(source) {
  const svg = new DOMParser().parseFromString(source, "image/svg+xml").documentElement;
  const unsupported = "Choose a Material Design Icons SVG downloaded from Pictogrammers.";
  if (svg.localName !== "svg" || svg.namespaceURI !== SVG_NS || svg.hasAttribute("transform")) {
    throw new Error(unsupported);
  }
  const geometry = document.createElementNS(SVG_NS, "svg");
  geometry.style.cssText = "position:absolute;top:0;left:0;width:24px;height:24px;visibility:hidden";
  geometry.setAttribute("aria-hidden", "true");
  const paths = [];
  for (const child of svg.children) {
    if (["title", "desc", "metadata"].includes(child.localName)) continue;
    const data = child.getAttribute("d")?.trim();
    if (child.namespaceURI !== SVG_NS || child.localName !== "path" || child.hasAttribute("transform")
      || !data || !/^[Mm][MmZzLlHhVvCcSsQqTtAaEe0-9.,+\s-]+$/.test(data)) {
      throw new Error(unsupported);
    }
    const path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("d", data);
    geometry.append(path);
    const rule = (child.getAttribute("fill-rule") ?? svg.getAttribute("fill-rule")) === "evenodd" ? "evenodd" : "nonzero";
    paths.push({ path: new Path2D(data), rule });
  }
  document.body.append(geometry);
  try {
    const { x, y, width, height } = geometry.getBBox();
    if (!paths.length || ![x, y, width, height].every(Number.isFinite)
      || width <= 0 || height <= 0 || width / height > MAX_ARTWORK_WIDTH / PRINTABLE_HEIGHT) {
      throw new Error(unsupported);
    }
    return { bounds: { x, y, width, height }, paths, source };
  } finally {
    geometry.remove();
  }
}

async function decodeGraphic(blob) {
  const header = new Uint8Array(await blob.slice(0, 8).arrayBuffer());
  let type;
  if ([137, 80, 78, 71, 13, 10, 26, 10].every((byte, index) => byte === header[index])) {
    type = "image/png";
  } else if (header[0] === 255 && header[1] === 216 && header[2] === 255) {
    type = "image/jpeg";
  } else {
    let encoding = "utf-8";
    if (header[0] === 255 && header[1] === 254) encoding = "utf-16le";
    if (header[0] === 254 && header[1] === 255) encoding = "utf-16be";
    const source = new TextDecoder(encoding).decode(await blob.arrayBuffer());
    if (/^\s*<(?:!doctype\s+html\b|html[\s>])/i.test(source)) {
      throw new Error("This opens a web page. Copy the image’s direct link or upload the image file.");
    }
    const svg = new DOMParser().parseFromString(source, "image/svg+xml").documentElement;
    if (svg.localName !== "svg" || svg.namespaceURI !== SVG_NS || svg.querySelector("parsererror")) {
      throw new Error("Choose a valid SVG, PNG, or JPG image.");
    }
    type = "image/svg+xml";
  }

  // Load SVGs in image mode, where scripts and external resources are disabled.
  const source = new Blob([blob], { type });
  const url = URL.createObjectURL(source);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    if (image.naturalWidth && image.naturalHeight) {
      const aspectRatio = image.naturalWidth / image.naturalHeight;
      const maxHeight = Math.max(1, fitHeight(MAX_ITEM_HEIGHT, aspectRatio));
      return { image, source, aspectRatio, maxHeight };
    }
  } catch {
    // Report unreadable files with or without intrinsic dimensions the same way.
  } finally {
    URL.revokeObjectURL(url);
  }
  throw new Error("Could not open the image. Choose another SVG, PNG, or JPG.");
}

async function fetchLinkedGraphic(url, signal) {
  let failure;
  try {
    const response = await fetch(url, { signal: AbortSignal.any([signal, AbortSignal.timeout(12000)]) });
    if (response.ok) return await response.blob();
    failure = `The image host returned HTTP ${response.status}.`;
  } catch (error) {
    if (signal.aborted) throw error;
    failure = error.name === "TimeoutError" ? "The image link timed out."
      : "The browser could not fetch this image. The host may block access from other sites.";
  }

  if (!document.documentElement.hasAttribute("data-local-graphic-import")) {
    throw new Error(`${failure} For blocked links, run python3 serve-label-printer.py and open the printed address, or upload the image.`);
  }
  try {
    const response = await fetch("/import-graphic", {
      method: "POST",
      body: url.href,
      signal: AbortSignal.any([signal, AbortSignal.timeout(15000)]),
    });
    if (response.ok) return await response.blob();
    failure = await response.text();
  } catch (error) {
    if (signal.aborted) throw error;
    throw new Error("The local downloader did not respond. Check that it is running and try again.");
  }
  throw new Error(failure);
}

  const overflow = height > PRINTABLE_HEIGHT ? " · Extends beyond the printable height" : "";
  graphicDimensions.textContent = `${width} × ${height} px${overflow}`;

async function loadGraphic(name, load) {
  if (graphicRequest) return;
  const request = new AbortController();
  graphicRequest = request;
  graphicLoad.disabled = true;
  graphicFile.disabled = true;
  clearGraphicDraft();
  showGraphicStatus("Loading graphic…");
  try {
    const blob = await load(request.signal);
    if (request.signal.aborted || !graphicDialog.open) return;
    const graphic = await decodeGraphic(blob);
    if (request.signal.aborted || !graphicDialog.open) return;
    const { maxHeight } = graphic;
    const size = Math.min(PRINTABLE_HEIGHT, maxHeight);
    graphicDraft = { kind: "graphic", name, graphic, size,
      threshold: graphicThreshold.valueAsNumber, inverted: graphicInvert.checked };
    graphicHeight.min = toMillimetres(Math.min(MIN_ITEM_HEIGHT, maxHeight));
    graphicHeight.max = toMillimetres(maxHeight);
    graphicHeight.value = toMillimetres(size);
    updateGraphicPreview();
    graphicAdjustments.hidden = false;
    graphicInsert.disabled = false;
    showGraphicStatus("");
  } catch (error) {
    if (!request.signal.aborted && graphicDialog.open) {
      clearGraphicDraft();
      showGraphicStatus(error.message, true);
    }
  } finally {
    if (graphicRequest === request) {
      graphicRequest = null;
      graphicLoad.disabled = false;
      graphicFile.disabled = false;
    }
  }
}

const isIntegerBetween = (value, min, max) => Number.isInteger(value) && value >= min && value <= max;

function readDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

function saveLabelItem(item, imageSources) {
  const { kind, x, y, rotation } = item;
  const placement = { kind, x, y, rotation };
  if (kind === "line") return { ...placement, shapeIndex: item.shapeIndex, dx: item.dx, dy: item.dy, lineWidth: item.lineWidth };
  if (isShape(item)) return { ...placement, shapeIndex: item.shapeIndex, width: item.width, height: item.height, lineWidth: item.lineWidth };
  const geometry = { ...placement, size: item.size };
  if (kind === "text") {
    const { text, font, weight, width, height, alignX, alignY } = item;
    const fixedSize = isFixedText(item);
    const saved = { ...geometry, text, font, weight, fixedSize };
    return fixedSize ? { ...saved, width, height, alignX, alignY } : saved;
  }
  if (kind === "icon") return { ...geometry, name: item.name, svg: item.icon.source };
  const { name, graphic: { source }, threshold, inverted } = item;
  if (!imageSources.has(source)) imageSources.set(source, imageSources.size);
  return { ...geometry, name, imageIndex: imageSources.get(source), threshold, inverted };
}

function downloadLabel(design) {
  const json = JSON.stringify(design, null, 2) + "\n";
  const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
  const link = document.createElement("a");
  link.href = url;
  const basename = design.name.replace(/[<>:"/\\|?*\x00-\x1f]/g, "_").replace(/[. ]+$/g, "");
  link.download = /\.json$/i.test(basename) ? basename : (basename || "katasymbol-label") + ".json";
  try {
    document.body.append(link);
    link.click();
  } finally {
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
}

function readSavedGraphic(dataUrl) {
  const header = /^data:(image\/(?:svg\+xml|png|jpeg));base64,/.exec(dataUrl);
  if (!header) throw new Error("Embedded graphics must be an SVG, PNG, or JPG.");
  const binary = atob(dataUrl.slice(header[0].length));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < bytes.length; i++) bytes[i] = binary.charCodeAt(i);
  return decodeGraphic(new Blob([bytes], { type: header[1] }));
}

async function openLabelItem(saved, images, graphics) {
  const { kind, x, y, size, rotation } = saved ?? {};
  if (typeof x !== "number" || typeof y !== "number"
    || !isIntegerBetween(x * 2, -MAX_ARTWORK_WIDTH * 2, MAX_ARTWORK_WIDTH * 2)
    || !isIntegerBetween(y * 2, -MAX_ARTWORK_WIDTH * 2, (PRINTABLE_HEIGHT + MAX_ITEM_HEIGHT) * 2)
    || ![0, 90, 180, 270].includes(rotation)) {
    throw new Error("Invalid position or rotation.");
  }
  if (kind === "line") {
    const { dx, dy, lineWidth } = saved;
    if (!Number.isInteger(dx) || !Number.isInteger(dy) || (!dx && !dy)
      || !isIntegerBetween(lineWidth, 1, PRINTABLE_HEIGHT)
      || Math.max(Math.abs(dx), Math.abs(dy)) + lineWidth > MAX_ARTWORK_WIDTH) throw new Error("Invalid line settings.");
    return { kind, x, y, rotation, dx, dy, lineWidth };
  }
  if (isShape(saved)) {
    const { width, height, lineWidth } = saved;
    if (!isIntegerBetween(width, 3, MAX_ARTWORK_WIDTH) || !isIntegerBetween(height, 3, MAX_ITEM_HEIGHT)
      || !isIntegerBetween(lineWidth, 1, maxShapeLineWidth(width, height))) throw new Error("Invalid shape settings.");
    return { kind, x, y, rotation, width, height, lineWidth };
  }
  const geometry = { kind, x, y, size, rotation };
  switch (kind) {
    case "text": {
      const { text, font: savedFont, weight, fixedSize = false, width, height, alignX, alignY } = saved;
      const font = ["nunito", "barlow-condensed"].includes(savedFont) ? "saira-extra-condensed" : savedFont;
      if (typeof text !== "string" || typeof font !== "string" || !Object.hasOwn(fontFamilies, font)
        || !["400", "700"].includes(weight) || typeof fixedSize !== "boolean") throw new Error("Invalid text settings.");
      const fontLoad = bundledFontLoads.get(font);
      if (fontLoad && !(await fontLoad)) throw new Error("This label's font could not be loaded.");
      const item = { ...geometry, text, font, weight, fixedSize };
      if (!fixedSize) return item;
      if (!isIntegerBetween(width, 1, MAX_ARTWORK_WIDTH) || !isIntegerBetween(height, 1, MAX_ITEM_HEIGHT)
        || typeof alignX !== "string" || typeof alignY !== "string"
        || !Object.hasOwn(horizontalAlignment, alignX) || !Object.hasOwn(verticalAlignment, alignY)) throw new Error("Invalid fixed text settings.");
      return { ...item, width, height, alignX, alignY };
    }
    case "icon": {
      const { name, svg } = saved;
      if (typeof name !== "string" || typeof svg !== "string") throw new Error("Invalid icon settings.");
      return { ...geometry, name, icon: readIcon(svg) };
    }
    case "graphic": {
      const { name, imageIndex, threshold, inverted } = saved;
      if (typeof name !== "string" || !isIntegerBetween(imageIndex, 0, images.length - 1)
        || typeof images[imageIndex] !== "string" || !isIntegerBetween(threshold, 0, 255)
        || typeof inverted !== "boolean") throw new Error("Invalid graphic settings.");
      if (!graphics.has(imageIndex)) graphics.set(imageIndex, readSavedGraphic(images[imageIndex]));
      return { ...geometry, name, threshold, inverted, graphic: await graphics.get(imageIndex) };
    }
    default: throw new Error("Unknown item type.");
  }
}

async function readLabel(file) {
  let saved;
  try {
    saved = JSON.parse(await file.text());
  } catch {
    throw new Error("Choose a valid JSON label file.");
  }
  if (saved?.format !== labelFormat || saved.version !== labelVersion
    || !Array.isArray(saved.items) || !Array.isArray(saved.images)) {
    throw new Error("Choose a label JSON file exported by the current editor.");
  }
  const { name = "", inverted } = saved;
  if (typeof name !== "string") throw new Error("The label has an invalid design name.");
  if (typeof inverted !== "boolean") throw new Error("The label must specify whether its colors are inverted.");
  const { left, right } = saved.margins ?? {};
  if (!isIntegerBetween(left, 0, Number(leftMarginInput.max)) || !isIntegerBetween(right, 0, Number(rightMarginInput.max))) {
    throw new Error("The label has invalid margins.");
  }
  const graphics = new Map();
  const restored = [];
  const indexes = initialShapeIndexes();
  const hasSavedIndexes = Object.hasOwn(saved, "nextShapeIndexes");
  const usedShapeIndexes = new Set();
  if (hasSavedIndexes) {
    for (const kind of indexes.keys()) {
      const next = saved.nextShapeIndexes?.[kind];
      if (!Number.isSafeInteger(next) || next < 1) throw new Error("The label has invalid shape numbering.");
      indexes.set(kind, next);
    }
  }
  let adjusted = false;
  for (const [index, stored] of saved.items.entries()) {
    try {
      const item = await openLabelItem(stored, saved.images, graphics);
      if (item.kind === "line") {
        const axis = item.rotation % 180 ? "dx" : "dy";
        item[axis] = clamp(item[axis], -PRINTABLE_HEIGHT, PRINTABLE_HEIGHT);
        if (item[axis] !== stored[axis]) adjusted = true;
      } else if (!isShape(item)) {
        const { min, max } = itemSizeLimits(item);
        if (!isIntegerBetween(item.size, min, max)) throw new Error("Size is out of range.");
      }
      layoutItem(item);
      if (item.x !== stored.x || item.y !== stored.y) adjusted = true;
      if (shapeItemNames.has(item.kind)) {
        if (hasSavedIndexes) {
          const key = `${item.kind}:${stored.shapeIndex}`;
          if (!isIntegerBetween(stored.shapeIndex, 1, indexes.get(item.kind) - 1) || usedShapeIndexes.has(key)) {
            throw new Error("Invalid or duplicate shape number.");
          }
          usedShapeIndexes.add(key);
          item.shapeIndex = stored.shapeIndex;
        } else {
          numberShape(item, indexes);
        }
      }
      restored.push(item);
    } catch (error) {
      throw new Error(`Item ${index + 1}. ${error.message}`);
    }
  }
  return { name, left, right, inverted, restored, adjusted, indexes };
}

    }
    designNameInput.value = name;
    labelInvert.checked = inverted;
    margins.left = left;
    margins.right = right;
    leftMarginInput.value = left;
    rightMarginInput.value = right;
    updateItemPicker();
    selectItem(items[0] ?? null);
    renderLabel();
    if (selected) revealSelected();
    showLabelFileStatus(adjusted ? "Label opened. Item geometry was adjusted to fit the print area." : "Label opened.");
  } catch (error) {
    showLabelFileStatus(error.message, true);
  } finally {
    importLabelButton.disabled = false;
  }
});

function refreshControls() {
  const connected = Boolean(connection);
  const identity = connected
    ? `Connected: ${connection.model} (${connection.channel.transport.displayName})`
    : "Connected: none";
  const batteryPercent = connection?.channel.batteryPercent;
  const battery = !connected ? "" : batteryPercent === null ? "Battery unknown" : `Battery ≈${batteryPercent}%`;
  if (connectionDevice.textContent !== identity) connectionDevice.textContent = identity;
  if (connectionBattery.textContent !== battery) connectionBattery.textContent = battery;
  connectionBattery.hidden = !connected;
  connectionIdentity.title = battery ? `${identity} · ${battery}` : identity;
  scanAll.disabled = working || connected || !isSecureContext || !navigator.bluetooth;
  connectButton.disabled = working;
  connectButton.textContent = connected ? "Disconnect" : "Connect";
  connectButton.toggleAttribute("data-connected", connected);
  updatePrintButton();
}

function onLost(transport) {
  if (connection?.channel.transport !== transport) return;
  const lost = connection;
  connection = null;
  void lost.channel.close();
  showConnectionError("Bluetooth connection lost.");
  refreshControls();
}

connectButton.addEventListener("click", async () => {
  showConnectionError();
  showPrintStatus("");
  working = true;
  refreshControls();
  let channel;
  try {
    if (connection) {
      const current = connection;
      connection = null;
      await current.channel.close();
      return;
    }
    if (!isSecureContext) throw new Error("Open this page on HTTPS or localhost in Chrome to connect a printer.");
    if (!navigator.bluetooth) throw new Error("Open this page in Chrome on a device that supports Web Bluetooth.");
    connectButton.textContent = "Connecting…";
    const transport = await openBle(scanAll.checked, onLost);
    channel = new PrinterChannel(transport);
    connection = { channel, model: transport.model };
    await handshake(channel);
    if (connection?.channel !== channel) throw new Error("Printer disconnected.");
  } catch (error) {
    if (connection?.channel === channel) connection = null;
    if (channel) await channel.close();
    const fileHint = location.protocol === "file:" && error.name === "SecurityError" ? " Open the page from localhost." : "";
    showConnectionError(error.name === "NotFoundError" ? "No printer selected." : error.message + fileHint);
  } finally {
    working = false;
    refreshControls();
  }
});

labelForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!connection || working || !printBounds) return;
  const { sourceX, width, leftMargin } = printBounds;
  const image = ink.getImageData(sourceX, 0, width, PRINTABLE_HEIGHT);
  const blankLeftMargin = labelInvert.checked ? 0 : leftMargin;
  const current = connection;
  let started = false;
  working = true;
  refreshControls();
  showPrintStatus("Preparing label…");
  try {
    await sendLabel(current, image, blankLeftMargin, showPrintStatus, () => { started = true; });
    showPrintStatus("Label printed.");
  } catch (error) {
    if (started) {
      if (connection === current) connection = null;
      await current.channel.close();
    }
    showPrintStatus(started ? error.message + " Check the printer before reconnecting and trying again." : error.message, "error");
  } finally {
    working = false;
    refreshControls();
  }
});

const themeToggle = document.querySelector("#theme-toggle");
const themeRoot = document.documentElement;
function updateThemeToggle() {
  const label = themeRoot.dataset.theme === "light" ? "Switch to dark mode" : "Switch to light mode";
  themeToggle.setAttribute("aria-label", label);
  themeToggle.title = label;
}
themeToggle.addEventListener("click", () => {
  const theme = themeRoot.dataset.theme === "light" ? "dark" : "light";
  themeRoot.dataset.theme = theme;
  updateThemeToggle();
  drawPreview();
  try {
    localStorage.setItem(themeStorageKey, theme);
  } catch (error) {
    console.warn("Could not save the theme preference.", error);
  }
});
updateThemeToggle();
themeToggle.hidden = false;

addItem({ kind: "text", text: "HELLO", font: "standard", weight: "700", size: 44 });
refreshControls();
</script>
</body>
